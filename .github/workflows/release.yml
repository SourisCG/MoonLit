name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version (must match package.json)
        required: true
        type: string
      runtime_input:
        description: Absolute path to the externally audited runtime input on the runner
        required: true
        type: string
      notices_file:
        description: Absolute path to the reviewed third-party notices file
        required: true
        type: string
      license_root:
        description: Absolute path to the reviewed third-party license-text directory
        required: true
        type: string
      source_offer_file:
        description: Absolute path to corresponding-source metadata bound to this SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: NSIS ${{ matrix.webview }}
    runs-on: windows-2022
    environment: release
    strategy:
      fail-fast: false
      matrix:
        webview: [standard, offline]
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      OBS_RUNTIME_INPUT: ${{ inputs.runtime_input }}
      RELEASE_NOTICES_FILE: ${{ inputs.notices_file }}
      RELEASE_LICENSE_ROOT: ${{ inputs.license_root }}
      RELEASE_SOURCE_OFFER_FILE: ${{ inputs.source_offer_file }}
      CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
      SIGNTOOL: signtool.exe
      DUMPBIN: dumpbin.exe
      WEBVIEW_MODE: ${{ matrix.webview }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-msvc
      - name: Validate exact release inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $actualSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actualSha -ne $env:GITHUB_SHA.ToLowerInvariant()) {
            throw "Checked out SHA $actualSha does not equal workflow SHA $env:GITHUB_SHA."
          }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain))) {
            throw "Release source worktree is dirty."
          }
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Release version is not a semantic version: $env:RELEASE_VERSION"
          }
          $package = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "package.json") -Raw | ConvertFrom-Json
          if ($package.version -cne $env:RELEASE_VERSION) {
            throw "Workflow version does not match package.json."
          }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_THUMBPRINT) -or
              $env:CERTIFICATE_THUMBPRINT.Replace(' ', '') -notmatch '^[0-9a-fA-F]{40}$') {
            throw "A release certificate thumbprint is mandatory; unsigned publication is forbidden."
          }
          foreach ($path in @($env:OBS_RUNTIME_INPUT, $env:RELEASE_NOTICES_FILE, $env:RELEASE_LICENSE_ROOT, $env:RELEASE_SOURCE_OFFER_FILE)) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not [IO.Path]::IsPathFullyQualified($path)) {
              throw "Release input must be an absolute path: $path"
            }
          }
          foreach ($file in @($env:RELEASE_NOTICES_FILE, $env:RELEASE_SOURCE_OFFER_FILE)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Release metadata input is missing: $file"
            }
          }
          foreach ($directory in @($env:OBS_RUNTIME_INPUT, $env:RELEASE_LICENSE_ROOT)) {
            if (-not (Test-Path -LiteralPath $directory -PathType Container)) {
              throw "Release directory input is missing: $directory"
            }
          }
      - name: Install locked dependencies
        shell: pwsh
        run: npm ci
      - name: Build recorder for the locked target
        shell: pwsh
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --manifest-path src-tauri/native/moonlit-recorder/Cargo.toml
      - name: Stage approved runtime
        shell: pwsh
        run: |
          $stageRoot = Join-Path $env:GITHUB_WORKSPACE "target/package-stage/windows-x86_64"
          $stageParent = Split-Path -Parent $stageRoot
          if (-not (Test-Path -LiteralPath $stageParent -PathType Container)) {
            New-Item -ItemType Directory -Path $stageParent -Force | Out-Null
          }
          $recorder = Join-Path $env:GITHUB_WORKSPACE "src-tauri/native/moonlit-recorder/target/x86_64-pc-windows-msvc/release/moonlit-recorder.exe"
          & (Join-Path $env:GITHUB_WORKSPACE "packaging/windows/Stage-Runtime.ps1") `
            -RuntimeInput $env:OBS_RUNTIME_INPUT `
            -RecorderBinary $recorder `
            -OutputRoot $stageRoot
      - name: Sign every staged PE before hashing it
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "target/package-stage/windows-x86_64/runtime/obs"
          $pes = @(Get-ChildItem -LiteralPath $stage -Recurse -File | Where-Object { $_.Extension.ToLowerInvariant() -in @('.exe', '.dll') } | Sort-Object FullName)
          if ($pes.Count -eq 0) {
            throw "No staged PE files were found to sign."
          }
          & (Join-Path $env:GITHUB_WORKSPACE "packaging/windows/Sign-Release.ps1") `
            -SignTool $env:SIGNTOOL `
            -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT `
            -Files @($pes.FullName)
      - name: Generate deterministic runtime manifest and SBOM
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "target/package-stage/windows-x86_64/runtime/obs"
          $manifest = Join-Path $stage "runtime-manifest.json"
          $sbom = Join-Path $stage "sbom.cdx.json"
          & (Join-Path $env:GITHUB_WORKSPACE "packaging/windows/Generate-RuntimeManifest.ps1") `
            -StageRoot $stage `
            -OutputFile $manifest `
            -SourceSha $env:GITHUB_SHA `
            -WorktreeStatus clean `
            -ProductVersion $env:RELEASE_VERSION
          & (Join-Path $env:GITHUB_WORKSPACE "packaging/windows/Generate-Sbom.ps1") `
            -StageRoot $stage `
            -RuntimeManifestFile $manifest `
            -OutputFile $sbom `
            -SourceSha $env:GITHUB_SHA `
            -WorktreeStatus clean `
            -ProductVersion $env:RELEASE_VERSION
      - name: Stage reviewed notices, licenses, and source offer
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "target/package-stage/windows-x86_64/runtime/obs"
          & (Join-Path $env:GITHUB_WORKSPACE "packaging/windows/Stage-ReleaseMetadata.ps1") `
            -StageRoot $stage `
            -NoticesFile $env:RELEASE_NOTICES_FILE `
            -LicenseRoot $env:RELEASE_LICENSE_ROOT `
            -SourceOfferFile $env:RELEASE_SOURCE_OFFER_FILE `
            -ApplicationLicenseFile (Join-Path $env:GITHUB_WORKSPACE "LICENSE") `
            -SourceSha $env:GITHUB_SHA `
            -ProductVersion $env:RELEASE_VERSION
      - name: Verify closure, imports, metadata, and signatures
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "target/package-stage/windows-x86_64/runtime/obs"
          & (Join-Path $env:GITHUB_WORKSPACE "packaging/windows/Verify-Runtime.ps1") `
            -StageRoot $stage `
            -ManifestFile (Join-Path $stage "runtime-manifest.json") `
            -SbomFile (Join-Path $stage "sbom.cdx.json") `
            -SourceSha $env:GITHUB_SHA `
            -ProductVersion $env:RELEASE_VERSION `
            -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT `
            -Dumpbin $env:DUMPBIN `
            -SignTool $env:SIGNTOOL
      - name: Build NSIS installer
        shell: pwsh
        run: |
          if ($env:WEBVIEW_MODE -eq "standard") {
            npm run tauri:build:windows
          } elseif ($env:WEBVIEW_MODE -eq "offline") {
            npm run tauri:build:windows:offline
          } else {
            throw "Unknown WebView mode: $env:WEBVIEW_MODE"
          }
      - name: Sign every NSIS installer
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter *.exe -File | Sort-Object FullName)
          if ($installers.Count -eq 0) {
            throw "NSIS produced no installer."
          }
          & (Join-Path $env:GITHUB_WORKSPACE "packaging/windows/Sign-Release.ps1") `
            -SignTool $env:SIGNTOOL `
            -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT `
            -Files @($installers.FullName)
      - name: Bind installer hashes to source and runtime hashes
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "target/package-stage/windows-x86_64/runtime/obs"
          $bundle = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter *.exe -File | Sort-Object FullName)
          $releaseManifest = Join-Path $env:GITHUB_WORKSPACE "target/package-stage/windows-x86_64/release-manifest-$env:WEBVIEW_MODE.json"
          & (Join-Path $env:GITHUB_WORKSPACE "packaging/windows/Generate-ReleaseManifest.ps1") `
            -StageRoot $stage `
            -RuntimeManifestFile (Join-Path $stage "runtime-manifest.json") `
            -SbomFile (Join-Path $stage "sbom.cdx.json") `
            -SourceOfferFile (Join-Path $stage "source-offer.json") `
            -NoticesFile (Join-Path $stage "THIRD_PARTY_NOTICES.txt") `
            -LicenseRoot (Join-Path $stage "licenses") `
            -InstallerFiles @($installers.FullName) `
            -OutputFile $releaseManifest `
            -SourceSha $env:GITHUB_SHA `
            -WorktreeStatus clean `
            -ProductVersion $env:RELEASE_VERSION `
            -WebviewMode $env:WEBVIEW_MODE `
            -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT `
            -SignTool $env:SIGNTOOL
      - name: Upload only signed release inputs
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: moonlit-windows-${{ inputs.version }}-${{ matrix.webview }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            target/package-stage/windows-x86_64/runtime/obs/runtime-manifest.json
            target/package-stage/windows-x86_64/runtime/obs/sbom.cdx.json
            target/package-stage/windows-x86_64/runtime/obs/source-offer.json
            target/package-stage/windows-x86_64/runtime/obs/THIRD_PARTY_NOTICES.txt
            target/package-stage/windows-x86_64/runtime/obs/licenses/**
            target/package-stage/windows-x86_64/release-manifest-${{ matrix.webview }}.json
