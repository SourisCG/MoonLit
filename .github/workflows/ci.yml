name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  rust-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/native/libobs-protocol/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/native/moonlit-recorder/Cargo.toml

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Validate packaging policy inputs
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File packaging/windows/Test-PackagingInputs.ps1
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - run: cargo test --locked --manifest-path src-tauri/native/libobs-protocol/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/native/moonlit-recorder/Cargo.toml
