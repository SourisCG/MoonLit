name: MoonLit CI

on:
  # The smoke builds run only when dispatched manually, so pushes do not
  # consume Actions minutes.
  workflow_dispatch:

jobs:
  ubuntu-core-smoke:
    name: Ubuntu core smoke (GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            qt6-base-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev

      - name: Configure core standalone
        run: cmake -S frontend/moonlit -B build-core -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build core and tests
        run: cmake --build build-core --target moonlit-tests --parallel 2

      - name: Run tests
        run: ctest --test-dir build-core --output-on-failure

  windows-core-smoke:
    name: Windows core smoke (MSVC)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Download obs-deps and Qt6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path .deps | Out-Null
          $base = 'https://github.com/obsproject/obs-deps/releases/download/2026-07-15'
          $deps = @(
            @{ url = "$base/windows-deps-2026-07-15-x64.zip"; out = '.deps/obs-deps-2026-07-15-x64' },
            @{ url = "$base/windows-deps-qt6-2026-07-15-x64.zip"; out = '.deps/obs-deps-qt6-2026-07-15-x64' }
          )
          foreach ($dep in $deps) {
            $zip = "$env:TEMP/$([System.IO.Path]::GetFileName($dep.url))"
            Invoke-WebRequest -Uri $dep.url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dep.out -Force
          }

      - name: Configure core standalone
        shell: pwsh
        run: |
          cmake -S frontend/moonlit -B build-core -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE/.deps/obs-deps-2026-07-15-x64;$env:GITHUB_WORKSPACE/.deps/obs-deps-qt6-2026-07-15-x64"

      - name: Build core and tests
        shell: pwsh
        run: cmake --build build-core --config RelWithDebInfo --target moonlit-tests --parallel 2

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build-core -C RelWithDebInfo --output-on-failure
