<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="moonlitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="10%" stop-color="#ef4444"/>
      <stop offset="90%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Crescent moon: outer circle (clockwise) + play-hole circle
       (counter-clockwise); opposite winding creates the hole with the
       default nonzero fill rule, which every SVG renderer handles. -->
  <path fill="url(#moonlitGrad)" d="
    M128 0
    A128 128 0 1 1 128 256
    A128 128 0 1 1 128 0
    Z
    M174 71.7
    A56.3 56.3 0 1 0 174 184.3
    A56.3 56.3 0 1 0 174 71.7
    Z"/>
  <!-- Play triangle inside the crescent hollow -->
  <path fill="#ffffff" d="M110 87 L110 169 L174 128 Z"/>
</svg>
