[package]
name = "moonlit"
version = "0.1.0"
description = "Windows-first game clip recorder with GPU acceleration and advanced audio mixing"
authors = ["SourisCG"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "moonlit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1.0"
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Media",
    "Media_Capture",
    "Media_MediaProperties",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Media_Audio",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "forbid"
