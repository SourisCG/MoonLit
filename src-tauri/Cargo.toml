[package]
name = "moonlit"
version = "0.1.0"
description = "Windows-first game clip recorder with GPU acceleration and advanced audio mixing"
authors = ["SourisCG"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "moonlit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
moonlit-windows-native = { path = "native/windows-native" }

[lints.rust]
unsafe_code = "forbid"
