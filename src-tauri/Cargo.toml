[package]
name = "moonlit"
version = "0.1.0"
description = "Windows-first game clip recorder with GPU acceleration and advanced audio mixing"
authors = ["SourisCG"]
license = "GPL-3.0-only"
repository = "https://github.com/SourisCG/MoonLit"
homepage = "https://github.com/SourisCG/MoonLit"
edition = "2021"
rust-version = "1.88"

[lib]
name = "moonlit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
moonlit-libobs-protocol = { path = "native/libobs-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
moonlit-windows-native = { path = "native/windows-native" }
global-hotkey = "0.6"

[lints.rust]
unsafe_code = "forbid"
