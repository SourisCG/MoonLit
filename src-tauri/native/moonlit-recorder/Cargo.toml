[package]
name = "moonlit-recorder"
version = "0.1.0"
description = "MoonLit process-isolated recording host"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.88"

[dependencies]
moonlit-libobs-protocol = { path = "../libobs-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
